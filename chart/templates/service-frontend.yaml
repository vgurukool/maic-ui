apiVersion: v1
kind: Service
metadata:
  name: maic-ui-frontend
  labels:
    app.kubernetes.io/name: maic-ui
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: maic-ui
    app.kubernetes.io/component: frontend
